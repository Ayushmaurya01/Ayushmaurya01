
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ayushmaurya01
          
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2314B8A6&color_dots=%23161B22,%23064E3B,%230B6E4F,%2310B981,%2334D399
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2314B8A6&color_dots=%23161B22,%23064E3B,%230B6E4F,%2310B981,%2334D399


      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
